repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    # A collection of git hooks.
    hooks:
      - id: trailing-whitespace
        # Trims trailing whitespace.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        # Makes sure files end in a newline and only a newline.
      - id: check-yaml
        # Checks that your YAML files are parseable.
      - id: check-added-large-files
        # Prevent giant files from being committed.
        args: [--maxkb=500]
      - id: fix-byte-order-marker
        # Removes BOMs from files.
      - id: check-merge-conflict
        # Check for files that contain merge conflict strings.
      - id: no-commit-to-branch
        # No commits to master or main.
        args: [--branch=master, --branch=main]

  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    # A hook to update pre-commit hooks.
    # https://pypi.org/project/pre-commit-update/
    rev: v0.6.1
    hooks:
      - id: pre-commit-update

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    # Opinionated Code Formatter. For JS, CSS, Markdown, JSON, YAML and more.
    hooks:
      - id: prettier

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    # Static analysis for GitHub Actions workflow files.
    rev: v1.7.6.22
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    # Find bugs in your shell scripts.
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    # Format shell script files.
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        # --write: Write a result to file instead of stdout.
        # --simplify: Simplify code.
        # --indent: Indent width.
        # --case-indent: Ensure "switch case" statements are indented.
        args: [--write, --simplify, --indent, "2", --case-indent]

  - repo: local
    hooks:
      # Use the same in .pre-commit-hooks.yaml
      - id: format-justfile
        name: Format Justfile files
        language: script
        entry: pre-commit-just.sh
        files: ".?[jJ]ust(file)?$"
