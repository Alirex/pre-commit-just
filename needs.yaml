# What this repo needs, by context. Schema and rules: HQ practices/needs-by-context.md.
# Check:  scripts/needs.py lint && scripts/needs.py check --context develop
# Render: scripts/needs.py render   (the README table between the needs markers)
version: 1
needs:
  - kind: tool
    name: bash
    min: "3.2"
    contexts: [run, develop, test, ci]
    level: required
    why: the hook is a bash 3.2 script (macOS ships 3.2)
    check: command
    fix: install bash
  - kind: tool
    name: just
    min: "1.40"
    contexts: [run, develop, test, ci]
    level: required
    why: the hook runs `just --fmt` and fails without just on PATH
    check: command
    fix: uv tool install rust-just
  - kind: tool
    name: git
    contexts: [develop, test, ci, release]
    level: required
    why: the hook runs in git repos; tests build scratch repos; tags make releases
    check: command
    fix: install git
  - kind: tool
    name: prek
    contexts: [develop, test, ci]
    level: required
    why: runs the quality gate hooks; tests/test.sh runs the hook through `prek try-repo`
    check: command
    fix: uv tool install prek
  - kind: tool
    name: uv
    contexts: [develop, ci]
    level: required
    why: installs prek and rust-just (uv tool install)
    check: command
    fix: curl -LsSf https://astral.sh/uv/install.sh | sh
  - kind: tool
    name: node
    contexts: [develop, ci]
    level: required
    why: the markdownlint and prettier hooks need Node.js on PATH
    check: command
    fix: install Node LTS (https://nodejs.org)
  - kind: tool
    name: gh
    contexts: [develop, release]
    level: optional
    why: watch CI runs and the release workflow
    fallback: use the GitHub web UI
    check: command
    fix: install GitHub CLI, then gh auth login
  - kind: network
    contexts: [develop, test, ci]
    level: required
    why: prek fetches hook repos, tests run `prek try-repo`, pushes go to GitHub
    check: none
    hosts: [github.com]
